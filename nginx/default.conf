server {
    listen 80;
    server_name api.baobui.click baobui.click;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name api.baobui.click baobui.click;

    ssl_certificate /etc/letsencrypt/live/api.baobui.click/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.baobui.click/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://app:3000;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

server {
    listen 80;
    server_name jenkins.baobui.click;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name jenkins.baobui.click;

    # Lưu ý: Bạn cần tạo chứng chỉ SSL cho jenkins.baobui.click trước khi nginx có thể khởi động thành công.
    # Sử dụng certbot để tạo: certbot certonly --standalone -d jenkins.baobui.click
    ssl_certificate /etc/letsencrypt/live/jenkins.baobui.click/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jenkins.baobui.click/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://host.docker.internal:8080;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}